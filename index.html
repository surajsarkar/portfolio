    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="favicon">
    <script>
        // Animated Favicon - DobbyFace with blinking eyes
        document.addEventListener('DOMContentLoaded', function () {
            const frames = [
                // Normal eyes
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                    <rect fill="#333" x="2" y="6" width="28" height="20" rx="4"/>
                    <rect fill="#050505" x="4" y="8" width="24" height="16" rx="2"/>
                    <circle fill="#00ffff" cx="11" cy="16" r="4"/>
                    <circle fill="#00ffff" cx="21" cy="16" r="4"/>
                </svg>`,
                // Blinking (closed eyes)
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                    <rect fill="#333" x="2" y="6" width="28" height="20" rx="4"/>
                    <rect fill="#050505" x="4" y="8" width="24" height="16" rx="2"/>
                    <rect fill="#00ffff" x="7" y="15" width="8" height="2" rx="1"/>
                    <rect fill="#00ffff" x="17" y="15" width="8" height="2" rx="1"/>
                </svg>`
            ];

            let currentFrame = 0;

            function updateFavicon(frame) {
                const favicon = document.getElementById('favicon');
                if (!favicon) return;
                const svgData = encodeURIComponent(frames[frame]);
                favicon.setAttribute('href', 'data:image/svg+xml,' + svgData);
            }

            function blink() {
                updateFavicon(1); // Closed eyes
                setTimeout(() => {
                    updateFavicon(0); // Open eyes
                }, 150);
            }

            // Initial update
            updateFavicon(0);

            // Blink every 3-5 seconds
            setInterval(blink, 3500);
        });
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"

        rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#53d22d",
                        "background-light": "#f6f8f6",
                        "background-dark": "#050508",
                        "surface-dark": "#0a0a0f",
                        "border-dark": "#1a1a25",
                    },
                    fontFamily: {

                        "DEFAULT": "1rem",

                        "full": "9999px"

                    animation: {
                        'fade-in': 'fadeIn 1s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },

                        }
                    }
                },
            },
        }
    </script>
    <style>
        .blink-cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Custom cursor spotlight smooth transition */
        .text-spotlight {
            transition: background-position 0.1s ease-out;
        }

        /* Gradient shift animation for highlighted text */
        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
                filter: drop-shadow(0 0 20px rgba(83, 210, 45, 0.5));
            }
            50% {
                background-position: 100% 50%;
                filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.6));
            }
        }

        /* Custom thin scrollbar - matches dark theme */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(10, 10, 15, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(26, 26, 37, 0.8);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(83, 210, 45, 0.3);
        }

        /* Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(26, 26, 37, 0.8) rgba(10, 10, 15, 0.5);
        }
    </style>
