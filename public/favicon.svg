<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .screen { fill: #050505; }
      .bezel { fill: #333; }
      .eye { fill: #00ffff; }
    </style>
  </defs>
  <!-- Robot head bezel -->
  <rect class="bezel" x="2" y="6" width="28" height="20" rx="4"/>
  <!-- Screen -->
  <rect class="screen" x="4" y="8" width="24" height="16" rx="2"/>
  <!-- Left eye -->
  <circle class="eye" cx="11" cy="16" r="4"/>
  <!-- Right eye -->
  <circle class="eye" cx="21" cy="16" r="4"/>
</svg>
